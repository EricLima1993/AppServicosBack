version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: db_servico_tecnico
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: ServicoTecnico
    ports:
      - "5556:3306"
    volumes:
      - ./data:/var/lib/mysql